<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f4c81">
<title>JNVST EVS Online Test</title>
<style>
:root{
  --blue:#0f4c81;--blue2:#1769aa;--light:#eef6ff;--ink:#17212b;
  --muted:#64748b;--line:#dbe5ef;--ok:#15803d;--bad:#b91c1c;
  --warn:#a16207;--card:#fff;--bg:#f4f7fb;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:980px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:22px;border-radius:18px;margin:8px 0 16px;box-shadow:0 10px 30px #0f4c8120}
.hero h1{font-size:clamp(22px,4vw,34px);margin:0 0 5px}
.hero p{margin:0;opacity:.92}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #0f172a0a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:680px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:14px}}
label{font-weight:700;display:block;margin:0 0 6px}
input,select{width:100%;padding:12px 13px;border:1px solid #b9c9d8;border-radius:10px;font-size:16px;background:#fff}
input:focus,select:focus{outline:3px solid #1769aa20;border-color:var(--blue2)}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:760px){.mode-grid{grid-template-columns:1fr}}
.mode{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.18s;background:#fff}
.mode:hover{border-color:#8db8db}
.mode.active{border-color:var(--blue2);background:#eef7ff;box-shadow:0 0 0 3px #1769aa12}
.mode input{width:auto;margin-right:6px}
.mode strong{display:block;font-size:17px;margin-bottom:4px}
.small{font-size:13px;color:var(--muted)}
.btn{appearance:none;border:0;border-radius:11px;padding:12px 17px;font-weight:800;font-size:15px;cursor:pointer}
.btn-primary{background:var(--blue2);color:#fff}
.btn-secondary{background:#e7eef5;color:#1e3a52}
.btn-danger{background:#b91c1c;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{display:inline-flex;gap:5px;align-items:center;padding:7px 10px;border-radius:999px;background:#eaf3fb;font-size:13px;font-weight:700;color:#234d70}
.progress{height:9px;background:#e6edf4;border-radius:999px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:var(--blue2);width:0;transition:.2s}
.qhead{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:9px}
.qtext{font-size:20px;line-height:1.55;font-weight:750;margin:3px 0 16px}
.option{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;cursor:pointer;background:#fff;transition:.15s}
.option:hover{border-color:#88b4d6;background:#f8fbff}
.option.selected{border-color:var(--blue2);background:#eaf5ff}
.option input{width:auto;margin-top:4px}
.opt-letter{min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef3f8;font-weight:900}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pnum{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-weight:700}
.pnum.current{outline:2px solid var(--blue2)}
.pnum.done{background:#dff3e5;border-color:#a7d7b5}
.hidden{display:none!important}
.status{padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
.status.ok{background:#e8f7ec;color:#166534}.status.warn{background:#fff7d6;color:#854d0e}.status.bad{background:#feecec;color:#991b1b}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
@media(max-width:680px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fbfdff}
.kpi b{font-size:22px;display:block}
.review-item{border-top:1px solid var(--line);padding:12px 0}
.review-item:first-child{border-top:0}
.correct{color:var(--ok);font-weight:800}.wrong{color:var(--bad);font-weight:800}.unanswered{color:var(--warn);font-weight:800}
footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}
.notice{background:#f8fafc;border-left:4px solid var(--blue2);padding:10px 12px;border-radius:8px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1 id="siteTitle">JNVST EVS Online Test</h1>
    <p>श्रेणीवार अभ्यास • 50 प्रश्नों का Fresh Random Test • Fixed SET 99</p>
  </header>

  <section id="startScreen">
    <div class="card">
      <h2 style="margin-top:0">परीक्षार्थी विवरण</h2>
      <div class="grid">
        <div>
          <label for="studentName">विद्यार्थी का नाम</label>
          <input id="studentName" autocomplete="name" placeholder="अपना नाम लिखें">
        </div>
        <div>
          <label for="mobile">रोल नंबर <span class="small">(अपना मोबाईल नंबर दर्ज करें)</span></label>
          <input id="mobile" inputmode="numeric" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर">
        </div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">टेस्ट का प्रकार चुनें</h2>
      <div class="mode-grid">
        <label class="mode active" data-mode="random">
          <span><input type="radio" name="mode" value="random" checked> <strong>Fresh Random Test</strong></span>
          <span class="small">सभी Active प्रश्नों में से 50 unique प्रश्न। हर बार नया टेस्ट।</span>
        </label>
        <label class="mode" data-mode="category">
          <span><input type="radio" name="mode" value="category"> <strong>श्रेणीवार टेस्ट</strong></span>
          <span class="small">प्राकृतिक जगत, मानव शरीर, दैनिक विज्ञान, सामाजिक परिवेश या गद्यांश।</span>
        </label>
        <label class="mode" data-mode="set99">
          <span><input type="radio" name="mode" value="set99"> <strong>SET 99</strong></span>
          <span class="small">Fixed confusing/review questions. सामान्य बैंक से कभी mix नहीं होंगे।</span>
        </label>
      </div>

      <div id="categoryControls" class="grid hidden" style="margin-top:14px">
        <div>
          <label for="categorySelect">श्रेणी</label>
          <select id="categorySelect"></select>
        </div>
        <div>
          <label for="countSelect">प्रश्नों की संख्या</label>
          <select id="countSelect"></select>
        </div>
      </div>

      <div id="bankInfo" class="notice" style="margin-top:14px"></div>
      <button id="startBtn" class="btn btn-primary" style="margin-top:14px;width:100%">टेस्ट शुरू करें</button>
      <div id="startError" class="status bad hidden"></div>
    </div>
  </section>

  <section id="quizScreen" class="hidden">
    <div class="card">
      <div class="toolbar">
        <div>
          <span class="pill" id="testLabel"></span>
          <span class="pill" id="studentLabel"></span>
        </div>
        <span class="pill">⏱ <span id="timer">00:00</span></span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="qhead" id="qMeta"></div>
      <div class="qtext" id="questionText"></div>
      <div id="options"></div>
      <div class="nav">
        <button id="prevBtn" class="btn btn-secondary">← पिछला</button>
        <button id="nextBtn" class="btn btn-primary">अगला →</button>
      </div>
      <div class="palette" id="palette"></div>
      <button id="submitBtn" class="btn btn-danger" style="width:100%;margin-top:16px">टेस्ट जमा करें</button>
    </div>
  </section>

  <section id="resultScreen" class="hidden">
    <div class="card">
      <h2 style="margin-top:0">परिणाम</h2>
      <div class="small" id="resultTitle"></div>
      <div class="kpis">
        <div class="kpi"><b id="rCorrect">0</b>सही</div>
        <div class="kpi"><b id="rWrong">0</b>गलत</div>
        <div class="kpi"><b id="rUnanswered">0</b>छोड़े</div>
        <div class="kpi"><b id="rPct">0%</b>प्रतिशत</div>
        <div class="kpi"><b id="rTime">0:00</b>समय</div>
      </div>
      <div id="saveStatus" class="status warn"></div>
      <div class="toolbar" style="margin-top:12px">
        <button class="btn btn-secondary" onclick="window.print()">परिणाम Print करें</button>
        <button class="btn btn-primary" id="newTestBtn">नया टेस्ट</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">उत्तर समीक्षा</h3>
      <div id="review"></div>
    </div>
  </section>

  <footer>JNVST EVS Practice System • Master Bank v2.0</footer>
</div>

<script src="config.js"></script>
<script src="question-bank.js"></script>
<script>
"use strict";
const CONFIG = window.JNVST_CONFIG || {googleScriptUrl:"",siteTitle:"JNVST EVS Online Test"};
const BANK = Array.isArray(window.JNVST_QUESTION_BANK) ? window.JNVST_QUESTION_BANK : [];
const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);

let mode = "random", testQuestions = [], answers = [], current = 0, startedAt = 0, timerId = null, testId = "", testDescriptor = "";

$("siteTitle").textContent = CONFIG.siteTitle || "JNVST EVS Online Test";

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function normText(s){
  return String(s).normalize("NFKC").toLowerCase().replace(/[\s?।,:;'"“”‘’()[\]\-–—/]+/g,"").trim();
}
function uniqueByQuestion(arr){
  const seen=new Set(), out=[];
  for(const q of arr){const k=normText(q.question);if(!seen.has(k)){seen.add(k);out.push(q);}}
  return out;
}
function activePool(){return BANK.filter(q=>q.status==="active" && q.eligible);}
function set99Pool(){return BANK.filter(q=>q.status==="set99");}
function categoryCounts(){
  const m=new Map();
  for(const q of activePool()) m.set(q.category,(m.get(q.category)||0)+1);
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],"hi"));
}
function populateCategories(){
  const sel=$("categorySelect");
  sel.innerHTML="";
  for(const [cat,count] of categoryCounts()){
    const o=document.createElement("option");o.value=cat;o.textContent=`${cat} (${count})`;sel.appendChild(o);
  }
  updateCountOptions();
}
function updateCountOptions(){
  const cat=$("categorySelect").value;
  const n=uniqueByQuestion(activePool().filter(q=>q.category===cat)).length;
  const values=[5,10,20,25,50].filter(x=>x<=n);
  if(!values.includes(n)) values.push(n);
  values.sort((a,b)=>a-b);
  $("countSelect").innerHTML=values.map(v=>`<option value="${v}">${v===n && ![5,10,20,25,50].includes(n) ? `सभी (${n})` : v+" प्रश्न"}</option>`).join("");
  if(values.includes(Math.min(20,n))) $("countSelect").value=String(Math.min(20,n));
}
function updateBankInfo(){
  const active=activePool().length, s99=set99Pool().length, pending=BANK.filter(q=>q.status==="pending").length;
  $("bankInfo").innerHTML=`Master Bank: <b>${BANK.length}</b> प्रश्न • Active: <b>${active}</b> • Fixed SET 99: <b>${s99}</b> • Pending/Excluded: <b>${pending}</b>`;
}
document.querySelectorAll(".mode").forEach(el=>{
  el.addEventListener("click",()=>{
    mode=el.dataset.mode;
    document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===el));
    el.querySelector("input").checked=true;
    $("categoryControls").classList.toggle("hidden",mode!=="category");
  });
});
$("categorySelect").addEventListener("change",updateCountOptions);

function prepareQuestion(q){
  const opts=q.options.map((text,i)=>({text,isCorrect:LETTERS[i]===q.correct,originalLetter:LETTERS[i]}));
  const sh=shuffle(opts);
  const ci=sh.findIndex(x=>x.isCorrect);
  return {...q, displayOptions:sh.map(x=>x.text), displayCorrect:LETTERS[ci]};
}
function createTest(){
  const name=$("studentName").value.trim();
  const mobile=$("mobile").value.replace(/\D/g,"");
  if(name.length<2) throw new Error("कृपया विद्यार्थी का नाम दर्ज करें।");
  if(!/^\d{10}$/.test(mobile)) throw new Error("कृपया 10 अंकों का मोबाइल नंबर दर्ज करें।");

  let selected=[];
  if(mode==="random"){
    const pool=uniqueByQuestion(activePool());
    selected=shuffle(pool).slice(0,50);
    testDescriptor="Fresh Random Test — 50 Questions";
  }else if(mode==="category"){
    const cat=$("categorySelect").value;
    const count=Number($("countSelect").value);
    const pool=uniqueByQuestion(activePool().filter(q=>q.category===cat));
    selected=shuffle(pool).slice(0,Math.min(count,pool.length));
    testDescriptor=`श्रेणीवार — ${cat} (${selected.length})`;
  }else{
    // Fixed membership. Only SET 99 questions are used; no replacement/mixing.
    selected=shuffle(set99Pool());
    testDescriptor=`SET 99 — Fixed Review (${selected.length})`;
  }
  if(!selected.length) throw new Error("इस चयन के लिए प्रश्न उपलब्ध नहीं हैं।");
  testQuestions=selected.map(prepareQuestion);
  answers=Array(testQuestions.length).fill("");
  current=0;
  startedAt=Date.now();
  testId=`EVS-${new Date().toISOString().replace(/\D/g,"").slice(0,14)}-${Math.floor(100+Math.random()*900)}`;
  $("studentLabel").textContent=`${name} • ${mobile}`;
  $("testLabel").textContent=testDescriptor;
  $("startScreen").classList.add("hidden");
  $("resultScreen").classList.add("hidden");
  $("quizScreen").classList.remove("hidden");
  buildPalette();
  renderQuestion();
  clearInterval(timerId);
  timerId=setInterval(updateTimer,1000);
  updateTimer();
}
$("startBtn").addEventListener("click",()=>{
  $("startError").classList.add("hidden");
  try{createTest()}catch(e){$("startError").textContent=e.message;$("startError").classList.remove("hidden");}
});

function buildPalette(){
  $("palette").innerHTML=testQuestions.map((_,i)=>`<button class="pnum" data-i="${i}">${i+1}</button>`).join("");
  $("palette").querySelectorAll(".pnum").forEach(b=>b.onclick=()=>{current=Number(b.dataset.i);renderQuestion();});
}
function renderQuestion(){
  const q=testQuestions[current];
  $("qMeta").textContent=`प्रश्न ${current+1} / ${testQuestions.length} • ${q.category} • ${q.topic} • ${q.id}`;
  $("questionText").textContent=q.question;
  $("options").innerHTML=q.displayOptions.map((text,i)=>{
    const L=LETTERS[i], checked=answers[current]===L;
    return `<label class="option ${checked?"selected":""}">
      <input type="radio" name="answer" value="${L}" ${checked?"checked":""}>
      <span class="opt-letter">${L}</span><span>${escapeHtml(text)}</span>
    </label>`;
  }).join("");
  $("options").querySelectorAll('input[name="answer"]').forEach(r=>{
    r.addEventListener("change",()=>{answers[current]=r.value;renderQuestion();});
  });
  $("prevBtn").disabled=current===0;
  $("nextBtn").disabled=current===testQuestions.length-1;
  $("progressBar").style.width=`${((current+1)/testQuestions.length)*100}%`;
  $("palette").querySelectorAll(".pnum").forEach((b,i)=>{
    b.classList.toggle("current",i===current);
    b.classList.toggle("done",!!answers[i]);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
$("prevBtn").onclick=()=>{if(current>0){current--;renderQuestion();}};
$("nextBtn").onclick=()=>{if(current<testQuestions.length-1){current++;renderQuestion();}};
function elapsedSec(){return Math.floor((Date.now()-startedAt)/1000);}
function fmtTime(sec){return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;}
function updateTimer(){$("timer").textContent=fmtTime(elapsedSec());}

$("submitBtn").addEventListener("click",()=>{
  const unanswered=answers.filter(x=>!x).length;
  const msg=unanswered?`${unanswered} प्रश्न अभी छोड़े गए हैं। क्या फिर भी टेस्ट जमा करें?`:"क्या आप टेस्ट जमा करना चाहते हैं?";
  if(confirm(msg)) finishTest();
});

async function finishTest(){
  clearInterval(timerId);
  const duration=elapsedSec();
  let correct=0;
  testQuestions.forEach((q,i)=>{if(answers[i]===q.displayCorrect) correct++;});
  const attempted=answers.filter(Boolean).length;
  const wrong=attempted-correct;
  const unanswered=testQuestions.length-attempted;
  const pct=Math.round((correct/testQuestions.length)*10000)/100;

  $("quizScreen").classList.add("hidden");
  $("resultScreen").classList.remove("hidden");
  $("rCorrect").textContent=correct;
  $("rWrong").textContent=wrong;
  $("rUnanswered").textContent=unanswered;
  $("rPct").textContent=pct+"%";
  $("rTime").textContent=fmtTime(duration);
  $("resultTitle").textContent=`${testDescriptor} • Test ID: ${testId}`;

  $("review").innerHTML=testQuestions.map((q,i)=>{
    const sel=answers[i];
    const si=sel?LETTERS.indexOf(sel):-1;
    const ci=LETTERS.indexOf(q.displayCorrect);
    const state=!sel?"unanswered":(sel===q.displayCorrect?"correct":"wrong");
    const label=!sel?"छोड़ा":(state==="correct"?"सही":"गलत");
    return `<div class="review-item">
      <div><b>${i+1}. ${escapeHtml(q.question)}</b> <span class="${state}">— ${label}</span></div>
      <div class="small">${q.id} • ${escapeHtml(q.sourceSet)} Q${q.sourceQuestion} • ${escapeHtml(q.category)}</div>
      <div>आपका उत्तर: <b>${sel?sel+" — "+escapeHtml(q.displayOptions[si]):"—"}</b></div>
      <div>सही उत्तर: <b class="correct">${q.displayCorrect} — ${escapeHtml(q.displayOptions[ci])}</b></div>
    </div>`;
  }).join("");

  const payload={
    timestamp:new Date().toISOString(),
    testId,
    mode,
    category:mode==="category"?$("categorySelect").value:"",
    studentName:$("studentName").value.trim(),
    rollNo:$("mobile").value.replace(/\D/g,""),
    set:testDescriptor,
    total:testQuestions.length,
    attempted,correct,wrong,unanswered,score:correct,percentage:pct,durationSeconds:duration,
    answers:answers.slice(),
    answerAudit:testQuestions.map((q,i)=>{
      const sel=answers[i], si=sel?LETTERS.indexOf(sel):-1, ci=LETTERS.indexOf(q.displayCorrect);
      return {
        originalQuestionNo:q.sourceQuestion,
        displayOrder:i+1,
        masterId:q.id,
        sourceSet:q.sourceSet,
        category:q.category,
        topic:q.topic,
        question:`[${q.id} | ${q.sourceSet} Q${q.sourceQuestion}] ${q.question}`,
        selectedLetter:sel,
        selectedText:si>=0?q.displayOptions[si]:"",
        correctLetter:q.displayCorrect,
        correctText:q.displayOptions[ci],
        originalCorrectLetter:q.correct,
        status:!sel?"छोड़ा":(sel===q.displayCorrect?"सही":"गलत"),
        testId
      };
    })
  };
  await saveResult(payload);
  window.scrollTo({top:0,behavior:"smooth"});
}
async function saveResult(payload){
  const url=(CONFIG.googleScriptUrl||"").trim();
  if(!url){
    $("saveStatus").className="status warn";
    $("saveStatus").textContent="Result स्क्रीन पर तैयार है, लेकिन Google Sheet URL config.js में सेट नहीं है; इसलिए ऑनलाइन रिकॉर्ड सेव नहीं हुआ।";
    return;
  }
  $("saveStatus").className="status warn";
  $("saveStatus").textContent="Google Sheet में परिणाम सेव किया जा रहा है…";
  try{
    const body=new URLSearchParams({payload:JSON.stringify(payload)});
    await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body});
    $("saveStatus").className="status ok";
    $("saveStatus").textContent="Result Google Sheet को भेज दिया गया है।";
  }catch(e){
    $("saveStatus").className="status bad";
    $("saveStatus").textContent="Result दिख रहा है, लेकिन Google Sheet में भेजने में समस्या हुई। Internet/Script URL जाँचें।";
  }
}
$("newTestBtn").onclick=()=>{
  clearInterval(timerId);
  $("resultScreen").classList.add("hidden");
  $("startScreen").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
};

populateCategories();
updateBankInfo();
if(!BANK.length){
  $("startError").textContent="question-bank.js load नहीं हुआ। index.html और question-bank.js को एक ही folder में रखें।";
  $("startError").classList.remove("hidden");
  $("startBtn").disabled=true;
}
</script>
</body>
</html>
