<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVS Online MCQ Quiz - Final</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--brand:#8f1d2c;--brand2:#b52b3c;--ok:#137333;--bad:#b3261e;--line:#e4e7ec;--warn:#8a5a00}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Mangal",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:980px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 30px #0002}.top h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px)}.top p{margin:0;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 4px 18px #0000000b}.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-weight:700;margin:0 0 6px}.field input,.field select{width:100%;padding:12px;border:1px solid #cfd4dc;border-radius:10px;font:inherit;background:#fff}.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#eef1f5;color:#222}.danger{background:#fff1f0;color:var(--bad);border:1px solid #f1b5b1}.btn:disabled{opacity:.5;cursor:not-allowed}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.pill{padding:7px 10px;border-radius:999px;background:#f0f2f5;font-size:14px;font-weight:700}.timer{font-variant-numeric:tabular-nums}.progress{height:8px;border-radius:99px;background:#eceff3;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--brand);width:0;transition:.2s}
.qnum{font-size:14px;color:var(--muted);font-weight:800}.question{font-size:21px;font-weight:800;line-height:1.55;margin:8px 0 16px}.option{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:12px;margin:9px 0;cursor:pointer}.option:hover{background:#fafafa}.option input{margin-top:5px;transform:scale(1.2)}.letter{font-weight:800;min-width:24px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}.pbtn{padding:9px 4px;border-radius:9px;border:1px solid var(--line);background:white;font-weight:750;cursor:pointer}.pbtn.answered{background:#e7f4eb;border-color:#a8d5b4}.pbtn.current{outline:3px solid #e8bbc2}
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.stat{border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center}.stat strong{font-size:25px;display:block}.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.review-item{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:13px;margin:10px 0}.review-item.correct{border-left-color:var(--ok)}.review-item.wrong{border-left-color:var(--bad)}.review-item.skipped{border-left-color:#d18b00}.small{font-size:13px;color:var(--muted)}.notice{background:#fff7e6;border:1px solid #f2d08f;color:#6b4b00;padding:12px;border-radius:10px;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.question{font-size:19px}.wrap{padding:10px}.card{padding:15px}}
</style>
</head>
<body><div class="wrap">
<section class="top"><h1>Online MCQ Quiz / Test System</h1><p>पर्यावरण अध्ययन (EVS) • अभ्यास परीक्षा</p></section>

<section id="startCard" class="card">
  <h2 style="margin-top:0">परीक्षा शुरू करें</h2>
  <div class="grid">
    <div class="field"><label>विद्यार्थी का नाम</label><input id="studentName" placeholder="पूरा नाम"></div>
    <div class="field"><label>रोल नंबर (अपना मोबाईल नंबर दर्ज करें)</label><input id="rollNo" inputmode="numeric" maxlength="10" placeholder="अपना मोबाईल नंबर दर्ज करें"></div>
    <div class="field"><label>सेट चुनें</label><select id="setSelect"></select></div>
    <div class="field"><label>कुल प्रश्न</label><input id="countPreview" readonly></div>
  </div>
  <button id="startBtn" class="btn primary" style="margin-top:14px">परीक्षा शुरू करें</button>
</section>

<section id="quizArea" class="hidden">
  <div class="card">
    <div class="meta"><div><b id="setTitle"></b><div class="small" id="studentMeta"></div></div><div class="pill timer">⏱ <span id="timer">00:00</span></div></div>
    <div class="progress"><div id="progressBar" class="bar"></div></div>
    <div class="qnum" id="qnum"></div><div class="question" id="question"></div><div id="options"></div>
    <div class="nav"><button id="prevBtn" class="btn secondary">← पिछला</button><button id="nextBtn" class="btn primary">अगला →</button></div>
  </div>
  <div class="card"><h3 style="margin-top:0">प्रश्न सूची</h3><div id="palette" class="palette"></div><button id="submitBtn" class="btn danger" style="margin-top:15px;width:100%">परीक्षा जमा करें</button></div>
</section>

<section id="resultArea" class="card hidden">
  <h2 style="margin-top:0">परिणाम</h2><p id="resultLine"></p>
  <div class="summary"><div class="stat"><strong id="stTotal"></strong><span>कुल</span></div><div class="stat"><strong id="stAttempt"></strong><span>उत्तर दिए</span></div><div class="stat"><strong id="stCorrect" class="ok"></strong><span>सही</span></div><div class="stat"><strong id="stWrong" class="bad"></strong><span>गलत</span></div><div class="stat"><strong id="stPct"></strong><span>प्रतिशत</span></div></div>
  <div id="saveStatus" class="notice"></div>
  <h3>उत्तर समीक्षा</h3><div id="review"></div>
  <button class="btn primary" onclick="location.reload()">दूसरा टेस्ट दें</button>
</section>
</div>
<script>
const QUIZ_SETS = {"SET 01": {"title": "पर्यावरण अध्ययन (EVS) — Test Yourself 1", "questions": [{"q": "पृथ्वी की अधिकांश सतह किससे ढँकी हुई है?", "o": ["मृदा से", "जल से", "बर्फ से", "वनों से"], "a": "B"}, {"q": "पृथ्वी पर विद्यमान जल का अधिकांश भाग किस प्रकार का है?", "o": ["लवणीय जल (खारा पानी)", "अलवणीय जल (मीठा पानी)", "भूमिगत जल", "वर्षा जल"], "a": "A"}, {"q": "यदि पृथ्वी का संपूर्ण जल 200 मिलीलीटर के गिलास में भरा हो, तो मीठे जल की मात्रा किसके बराबर होगी?", "o": ["आधे गिलास के", "एक चम्मच (5 मिलीलीटर) के", "पूरे गिलास के", "दो गिलास के"], "a": "B"}, {"q": "सभी सजीव जीवित रहने के लिए किस जल पर निर्भर हैं?", "o": ["लवणीय जल", "अलवणीय (मीठे) जल", "समुद्री जल", "किसी पर नहीं"], "a": "B"}, {"q": "जल के कौन-से तीन रूप होते हैं?", "o": ["द्रव, ठोस, वाष्प", "गर्म, ठंडा, सामान्य", "मीठा, खारा, कड़वा", "साफ, गंदा, रंगीन"], "a": "A"}, {"q": "वर्षा में जल किस रूप में होता है?", "o": ["ठोस", "द्रव", "वाष्प", "गैस"], "a": "B"}, {"q": "बर्फ जल का कौन-सा रूप है?", "o": ["द्रव रूप", "ठोस रूप", "वाष्प रूप", "गैसीय रूप"], "a": "B"}, {"q": "स्टील के गिलास में बर्फ डालने पर गिलास के बाहर जो जलकण दिखाई देते हैं, वे कहाँ से आते हैं?", "o": ["गिलास के अंदर से रिसकर", "वायु में उपस्थित जलवाष्प के संघनन से", "बर्फ के अंदर से", "यह जलकण नहीं है"], "a": "B"}, {"q": "जल को गर्म करने पर वह किसमें परिवर्तित हो जाता है?", "o": ["बर्फ में", "वाष्प में", "मृदा में", "चट्टान में"], "a": "B"}, {"q": "प्रकृति में जल की सतत चक्रीय गति को क्या कहते हैं?", "o": ["जल-चक्र", "वायु-चक्र", "जीवन-चक्र", "मृदा-चक्र"], "a": "A"}, {"q": "जल-चक्र में सूर्य के ताप के कारण महासागरों और नदियों का जल किसमें परिवर्तित होता है?", "o": ["बर्फ में", "जलवाष्प में", "मृदा में", "चट्टान में"], "a": "B"}, {"q": "जलवाष्प के ठंडा होने पर क्या बनते हैं?", "o": ["बादल", "पर्वत", "रेगिस्तान", "मैदान"], "a": "A"}, {"q": "बादलों से जल पृथ्वी पर किन-किन रूपों में बरसता है?", "o": ["केवल वर्षा के रूप में", "वर्षा, बर्फ और ओलों के रूप में", "केवल बर्फ के रूप में", "केवल वाष्प के रूप में"], "a": "B"}, {"q": "भूमिगत जल किसे कहते ह const letters=['A','B','C','D'];
let setKey='', quiz=null, current=0, answers=[], startedAt=null, tick=null;
const $=id=>document.getElementById(id);

function init(){
  Object.keys(QUIZ_SETS).forEach(k=>{const op=document.createElement('option');op.value=k;op.textContent=`${k} — ${QUIZ_SETS[k].questions.length} प्रश्न`; $('setSelect').appendChild(op)});
  $('setSelect').addEventListener('change', updateCount); updateCount();
  $('startBtn').onclick=startQuiz; $('prevBtn').onclick=()=>go(current-1); $('nextBtn').onclick=()=>go(current+1); $('submitBtn').onclick=submitQuiz;
}
function updateCount(){const k=$('setSelect').value; $('countPreview').value=k?QUIZ_SETS[k].questions.length:''}
function startQuiz(){
  const name=$('studentName').value.trim(), roll=$('rollNo').value.trim();
  if(!name){alert('कृपया विद्यार्थी का नाम भरें।');return}
  if(!roll){alert('कृपया रोल नंबर के स्थान पर अपना मोबाईल नंबर दर्ज करें।');return}
  if(!/^\d{10}$/.test(roll)){alert('कृपया 10 अंकों का सही मोबाईल नंबर दर्ज करें।');return}
  setKey=$('setSelect').value; quiz=QUIZ_SETS[setKey]; answers=Array(quiz.questions.length).fill(null); current=0; startedAt=Date.now();
  $('startCard').classList.add('hidden'); $('quizArea').classList.remove('hidden'); $('setTitle').textContent=`${setKey}: ${quiz.title}`; $('studentMeta').textContent=`${name} • Roll: ${roll}`;
  tick=setInterval(updateTimer,1000); updateTimer(); buildPalette(); render();
}
function updateTimer(){const sec=Math.floor((Date.now()-startedAt)/1000); const m=String(Math.floor(sec/60)).padStart(2,'0'), s=String(sec%60).padStart(2,'0'); $('timer').textContent=`${m}:${s}`}
function buildPalette(){ $('palette').innerHTML=''; quiz.questions.forEach((_,i)=>{let b=document.createElement('button');b.className='pbtn';b.textContent=i+1;b.onclick=()=>go(i);$('palette').appendChild(b)}); }
function render(){
  const item=quiz.questions[current]; $('qnum').textContent=`प्रश्न ${current+1} / ${quiz.questions.length}`; $('question').textContent=item.q; $('options').innerHTML='';
  item.o.forEach((txt,i)=>{const lab=document.createElement('label');lab.className='option';lab.innerHTML=`<input type="radio" name="opt" value="${letters[i]}" ${answers[current]===letters[i]?'checked':''}><span class="letter">${letters[i]}.</span><span>${escapeHtml(txt)}</span>`;lab.querySelector('input').onchange=e=>{answers[current]=e.target.value;refreshPalette()};$('options').appendChild(lab)});
  $('prevBtn').disabled=current===0; $('nextBtn').textContent=current===quiz.questions.length-1?'अंतिम प्रश्न':'अगला →'; $('progressBar').style.width=`${((current+1)/quiz.questions.length)*100}%`; refreshPalette();
}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function refreshPalette(){[...$('palette').children].forEach((b,i)=>{b.classList.toggle('answered',!!answers[i]);b.classList.toggle('current',i===current)})}
function go(i){if(i<0||i>=quiz.questions.length)return;current=i;render();window.scrollTo({top:0,behavior:'smooth'})}
function submitQuiz(){
  const unanswered=answers.filter(x=>!x).length; if(!confirm(`आप ${quiz.questions.length-unanswered} प्रश्नों के उत्तर दे चुके हैं। ${unanswered} प्रश्न छोड़े गए हैं। क्या परीक्षा जमा करें?`))return;
  clearInterval(tick); const correct=answers.reduce((n,a,i)=>n+(a===quiz.questions[i].a),0), attempted=quiz.questions.length-unanswered, wrong=attempted-correct, pct=(correct/quiz.questions.length*100).toFixed(2), duration=Math.floor((Date.now()-startedAt)/1000);
  $('quizArea').classList.add('hidden'); $('resultArea').classList.remove('hidden'); $('stTotal').textContent=quiz.questions.length; $('stAttempt').textContent=attempted; $('stCorrect').textContent=correct; $('stWrong').textContent=wrong; $('stPct').textContent=pct+'%';
  $('resultLine').textContent=`${$('studentName').value.trim()} • ${setKey} • ${correct}/${quiz.questions.length} सही`;
  renderReview();
  const payload={timestamp:new Date().toISOString(),studentName:$('studentName').value.trim(),rollNo:$('rollNo').value.trim(),set:setKey,total:quiz.questions.length,attempted,correct,wrong,unanswered,score:correct,percentage:pct,durationSeconds:duration,answers};
  localStorage.setItem('evs_quiz_last_result',JSON.stringify(payload));
  if(GOOGLE_SCRIPT_URL){saveRemote(payload)}else{$('saveStatus').innerHTML='परिणाम इस ब्राउज़र में सुरक्षित है। Google Sheet में सेव करने के लिए दिए गए Apps Script को deploy करके HTML में <b>GOOGLE_SCRIPT_URL</b> भरना होगा।'}
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderReview(){
  $('review').innerHTML=''; quiz.questions.forEach((q,i)=>{const chosen=answers[i], good=chosen===q.a, cls=!chosen?'skipped':good?'correct':'wrong'; const div=document.createElement('div');div.className='review-item '+cls;div.innerHTML=`<b>Q${i+1}. ${escapeHtml(q.q)}</b><div style="margin-top:6px">आपका उत्तर: <b>${chosen||'छोड़ा'}</b> &nbsp; | &nbsp; सही उत्तर: <b>${q.a}</b> — ${escapeHtml(q.o[letters.indexOf(q.a)])}</div>`;$('review').appendChild(div)});
}
async function saveRemote(payload){
  $('saveStatus').textContent='Google Sheet में परिणाम सेव किया जा रहा है…';
  try{const body=new URLSearchParams({payload:JSON.stringify(payload)});await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});$('saveStatus').textContent='परिणाम Google Sheet को भेज दिया गया है।';}
  catch(e){$('saveStatus').textContent='परिणाम स्क्रीन पर सुरक्षित है, लेकिन Google Sheet में भेजने में समस्या हुई। Apps Script URL/permission जाँचें।';}
}
init();
</script></body></html>
